<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ミエル">
  <!--
    アイコン：夜空の円（地平線）を横切る軌道と、最大仰角の光点。
    アプリの中心機能であるスカイマップをそのまま縮図にしている。
  -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05070D"/>
  <circle cx="256" cy="256" r="196" fill="url(#sky)"/>

  <!-- 仰角リング -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="5"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4" stroke-dasharray="7 16"/>

  <!-- 星 -->
  <circle cx="160" cy="150" r="5" fill="#C7D2FE" opacity="0.55"/>
  <circle cx="352" cy="172" r="4" fill="#C7D2FE" opacity="0.42"/>
  <circle cx="330" cy="356" r="4.5" fill="#C7D2FE" opacity="0.48"/>
  <circle cx="170" cy="330" r="3.5" fill="#C7D2FE" opacity="0.38"/>

  <!-- 軌道：南西の地平線から昇り、天頂近くを通って北東へ -->
  <path d="M117 372 C 170 250, 330 196, 400 148"
        fill="none" stroke="url(#orbit)" stroke-width="17" stroke-linecap="round"/>

  <!-- 最大仰角の光点 -->
  <circle cx="284" cy="212" r="34" fill="#FFC46B" opacity="0.30" filter="url(#glow)"/>
  <circle cx="284" cy="212" r="21" fill="#FFC46B"/>
</svg>
